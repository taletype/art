version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Tailwind 4 requires a deliberate CSS pipeline migration; keep v3 updated for now.
      - dependency-name: "tailwindcss"
        versions:
          - ">=4.0.0"
      # Next 16 requires a deliberate framework migration; keep v15 updated for now.
      - dependency-name: "next"
        versions:
          - ">=16.0.0"
      # Keep ambient Node types aligned with .nvmrc and package.json engines.
      - dependency-name: "@types/node"
        versions:
          - ">=23.0.0"
      # TypeScript 6 needs a deliberate migration; the current major update PR fails npm ci.
      - dependency-name: "typescript"
        versions:
          - ">=6.0.0"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ci-actions:
        patterns:
          - "*"
